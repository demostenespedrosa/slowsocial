name: SlowSocial Mobile Flutter CI & APK Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Permite disparar o build manualmente na aba Actions do GitHub

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Instalar Dependências Flutter
        working-directory: mobile
        run: flutter pub get

      - name: Executar Testes Unitários
        working-directory: mobile
        run: flutter test

      - name: Compilar APK de Release Android
        working-directory: mobile
        run: flutter build apk --release

      - name: Publicar APK para Download (Artefato GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: slowsocial-android-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
