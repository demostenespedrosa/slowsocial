<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- SEO & Metadados -->
    <title>Slow Social — Conexões Conscientes</title>
    <meta

      content="Uma rede social calma, consciente e inspiradora inspirada nos melhores padrões da Apple. Menos dopamina artificial, mais profundidade."
    />
    <meta name="author" content="Slow Social" />

    <!-- Open Graph / Redes Sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Slow Social — Conexões Conscientes" />

      content="Rede social com ritmo humano, momentos efêmeros de calma e conexões com significado."
    />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Apple iOS Safari PWA Configurações Nativas -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Slow Social" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="msapplication-TileColor" content="#7C65C1" />

  <body class="bg-[#FAF8F5] text-[#1C1917] antialiased selection:bg-[#7C65C1]/20 selection:text-[#7C65C1] min-h-screen">
