allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { subproject ->
    if (subproject.name != "app") {
        subproject.ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 24,
            targetSdkVersion: 34,
            ndkVersion: "27.0.12077973",
            source: '../..'
        ]
        subproject.plugins.withId("com.android.library") {
            try {
                if (!subproject.android.extensions.findByName("flutter")) {
                    subproject.android.extensions.add("flutter", [
                        compileSdkVersion: 34,
                        minSdkVersion: 24,
                        targetSdkVersion: 34,
                        ndkVersion: "27.0.12077973",
                        source: '../..'
                    ])
                }
            } catch (ignored) {}
            try {
                subproject.android {
                    compileSdkVersion 34
                    if (namespace == null) {
                        namespace subproject.group
                    }
                }
            } catch (ignored) {}
        }
    }
}

subprojects { subproject ->
    if (subproject.name != "app") {
        subproject.evaluationDependsOn(":app")
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
