buildscript {
    ext.flutter = [
        compileSdkVersion: 34,
        minSdkVersion: 24,
        targetSdkVersion: 34,
        ndkVersion: "27.0.12077973",
        source: '../..'
    ]
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 24,
            targetSdkVersion: 34,
            ndkVersion: "27.0.12077973",
            source: '../..'
        ]
        plugins.withId("com.android.library") {
            try {
                if (!project.android.extensions.findByName("flutter")) {
                    project.android.extensions.add("flutter", [
                        compileSdkVersion: 34,
                        minSdkVersion: 24,
                        targetSdkVersion: 34,
                        ndkVersion: "27.0.12077973",
                        source: '../..'
                    ])
                }
            } catch (ignored) {}
        }
    }
}

subprojects {
    if (project.name != "app") {
        project.evaluationDependsOn(":app")
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.name != "app" && project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 34
                defaultConfig {
                    targetSdkVersion 34
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
