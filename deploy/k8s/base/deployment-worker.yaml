apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowsocial-worker
  labels:
    app: slowsocial-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slowsocial-worker
  template:
    metadata:
      labels:
        app: slowsocial-worker
    spec:
      containers:
        - name: worker
          image: slowsocial/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: slowsocial-config
            - secretRef:
                name: slowsocial-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
