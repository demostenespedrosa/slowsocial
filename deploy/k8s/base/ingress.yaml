apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slowsocial-ingress
  labels:
    app.kubernetes.io/name: slowsocial
    app.kubernetes.io/part-of: slowsocial-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # WebSocket support for /ws and real-time messaging
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "slowsocial-api-svc"
    # Cloudflare real IP restoration
    nginx.ingress.kubernetes.io/enable-real-ip: "true"
spec:
  tls:
    - hosts:
        - api.slowsocial.app
      secretName: slowsocial-tls-cert
  rules:
    - host: api.slowsocial.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slowsocial-api-svc
                port:
                  number: 80
