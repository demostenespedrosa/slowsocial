apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowsocial-api
  labels:
    app: slowsocial-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: slowsocial-api
  template:
    metadata:
      labels:
        app: slowsocial-api
    spec:
      containers:
        - name: api
          image: slowsocial/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: slowsocial-config
            - secretRef:
                name: slowsocial-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: slowsocial-api-svc
spec:
  type: ClusterIP
  selector:
    app: slowsocial-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slowsocial-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slowsocial-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
