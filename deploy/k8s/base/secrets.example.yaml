apiVersion: v1
kind: Secret
metadata:
  name: slowsocial-secrets
  labels:
    app.kubernetes.io/name: slowsocial
    app.kubernetes.io/part-of: slowsocial-platform
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:CHANGE_ME_PASSWORD@slowsocial-postgres:5432/slowsocial?sslmode=require"
  REDIS_URL: "redis://:CHANGE_ME_PASSWORD@slowsocial-redis:6379/0"
  SUPABASE_JWT_SECRET: "CHANGE_ME_SUPABASE_JWT_SECRET_32_CHARS"
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_KEY: "CHANGE_ME_SUPABASE_SERVICE_ROLE_KEY"
  S3_ACCESS_KEY_ID: "CHANGE_ME_AWS_ACCESS_KEY_ID"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME_AWS_SECRET_ACCESS_KEY"
  FIREBASE_CREDENTIALS_JSON: '{"type":"service_account","project_id":"slowsocial-production"}'
